name: Build AN7581 kernels

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
    paths:
      - "openbsd-an7581.patch"
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "firmware/**"

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build on OpenBSD 8.0 amd64
        uses: vmactions/openbsd-vm@v1
        with:
          release: "8.0"
          arch: x86_64
          mem: 8192
          prepare: |
            pkg_add llvm-21.1.8p7
          run: ./scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: an7581-kernels
          path: |
            dist/bsd.rd
            dist/bsd.mp
      - name: Publish release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/bsd.rd
            dist/bsd.mp
